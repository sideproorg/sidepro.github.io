# sidepro.org — configuración de Jekyll (compila GitHub Pages, sin plugins ni tema externo)
title: sidepro
description: Horas libres puestas en side projects que mejoran proyectos locales.
url: "https://sidepro.org"
baseurl: ""
lang: es
timezone: America/Argentina/Cordoba

# Quién firma y cómo se escribe. Cambiar aquí y aparece en todas las páginas.
firma: "[tu nombre]"
correo_proyecto: "sidepro.org@gmail.com"

# Formulario de /fessionals. Queda cerrado hasta que exista un responsable de datos con domicilio.
# Cuando se abra: formulario_abierto: true, y el Worker desplegado en worker_url (ver worker/README.md).
formulario_abierto: false
archivo_mb: 10 # tamaño máximo del archivo del formulario; tiene que coincidir con MAX_MB en worker/wrangler.toml
worker_url: "https://anotarse.sidepro.org/anotarse"
aviso_version: "2026-10-27"
responsable_datos: "sidepro, organización descentralizada"
domicilio_datos: ""
herramienta_datos: "Cloudflare Workers y Email Routing (Cloudflare, Inc., EE.UU.), que reenvían sin guardar; el buzón del proyecto"

collections:
  pedidos:
    output: true
    permalink: /jects/:name/
  rfc:
    output: true
    permalink: /rfc/:name/
  pedidos_en:
    output: true
    permalink: /en/jects/:name/
  rfc_en:
    output: true
    permalink: /en/rfc/:name/

defaults:
  - scope: { path: "", type: "pedidos" }
    values: { layout: pedido }
  - scope: { path: "", type: "rfc" }
    values: { layout: rfc }
  - scope: { path: "", type: "pedidos_en" }
    values: { layout: pedido, lang: en }
  - scope: { path: "", type: "rfc_en" }
    values: { layout: rfc, lang: en }
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "" }
    values: { layout: default }

# Idiomas: español en la raíz, inglés en /en/. Cada página tiene su par con la misma ruta.
# Textos de la interfaz en _data/ui.yml; datos en inglés en _data/en/; fichas y RFC en _pedidos_en/ y _rfc_en/.
# Al cambiar una ficha o una RFC, cambiar también su par en el otro idioma.
description_en: "Spare hours put into side projects that improve local projects."

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - worker
  - README.md
  - CONTRIBUTING.md
  - MANTENIMIENTO.md
  - LICENSE
  - LICENSE-CODIGO
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
