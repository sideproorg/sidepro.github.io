# "How to take part", in three steps. Pair of _data/pasos.yml.
- "Sign up. Say what you do in IT and your real spare hours, and choose how you come in: you bring a socio-environmental organization from where you live that already knows what it needs, and you tell us however you can (text, audio or a photo of the paper); or you sign up for two of the requests in /jects. A person replies, with their name."
- "Paper. Before writing any code there is an online meeting with whoever will use the system every day. With the notebook or spreadsheet where everything gets lost today on screen, we sketch how a record is entered, found and corrected. If the operator doesn't get it, nothing gets coded. The signed request comes out of that. It is recorded with permission, and whoever joins later listens to it before touching any data."
- "Date. In the form you mark your free time slots in the week. Whoever convenes cross-checks them in /cruzar/, storing nothing, and proposes a day and time in the issue of the project's repo, with their name. From there the request runs through its five stages."
