# "How to take part", in three steps. Pair of _data/pasos.yml.
- "Sign up. Say what you do in IT and your real spare hours, and choose how you come in: you bring a socio-environmental organization from where you live, or you sign up for two of the requests in /jects. If you bring one, you describe in a few lines the organization and the need as you see it, including what you haven't confirmed yet (stage 0). A person replies, with their name."
- "Discovery and paper. If you brought a project, you meet the organization with a checklist and come back with each assumption confirmed or corrected and the need described in their words; with that, the organization writes and signs its request (stage 1). Then, before writing any code, there is an online meeting with whoever will use the system every day: with the notebook or spreadsheet on screen, we sketch how a record is entered, found and corrected. If the operator doesn't get it, nothing gets coded. It is recorded with permission, and whoever joins later listens to it before touching any data."
- "Date. In the form you mark your free time slots in the week. Whoever convenes cross-checks them in /cruzar/, storing nothing, and proposes a day and time in the issue of the project's repo, with their name. From there the request runs through its five stages."
