# "Cómo participar", en tres pasos (la persona). Cómo se hace un pedido, en cinco etapas, está en la RFC-001 (el pedido).
# Cada línea entre comillas: si el texto lleva dos puntos, YAML lo leería como otra cosa.
- "Anótate. Dices qué haces en IT y tus horas libres reales, y eliges cómo entras: traes una organización socio-ambiental de tu localidad que ya sabe qué le falta, y lo cuentas como puedas (texto, audio o foto del papel); o te anotas a dos de los pedidos de /jects. Contesta una persona, con nombre."
- "Papel. Antes de escribir código hay una reunión en línea con quien va a usar el sistema cada día. Con el cuaderno o la planilla donde hoy se pierde todo a la vista, se dibuja cómo se carga, se busca y se corrige un dato. Si quien opera no lo entiende, no se programa. De ahí sale la ficha firmada. Se graba con permiso, y quien entra después la escucha antes de tocar datos."
- "Fecha. En el formulario marcas tus franjas libres de la semana. Quien convoca las cruza en /cruzar/, sin guardar nada, y propone día y hora en el issue del repo del proyecto, con nombre. Desde ahí el pedido corre por sus cinco etapas."
