# "Cómo participar", en tres pasos (la persona). Cómo se hace un pedido, en cinco etapas, está en la RFC-001 (el pedido).
# Cada línea entre comillas: si el texto lleva dos puntos, YAML lo leería como otra cosa.
- "Anótate. Dices qué haces en IT y tus horas libres reales, y eliges cómo entras: traes una organización socio-ambiental de tu localidad, o te anotas a dos de los pedidos de /jects. Si traes una, describes en pocas líneas la organización y la necesidad tal como la ves, con lo que todavía no confirmaste (etapa 0). Contesta una persona, con nombre."
- "Relevamiento y papel. Si trajiste un proyecto, te reúnes con la organización con una hoja de chequeo y vuelves con cada supuesto confirmado o corregido y la necesidad descrita en sus palabras; con eso la organización escribe y firma su ficha (etapa 1). Después, antes de escribir código, hay una reunión en línea con quien va a usar el sistema cada día: con el cuaderno o la planilla a la vista, se dibuja cómo se carga, se busca y se corrige un dato. Si quien opera no lo entiende, no se programa. Se graba con permiso, y quien entra después la escucha antes de tocar datos."
- "Fecha. En el formulario marcas tus franjas libres de la semana. Quien convoca las cruza en /cruzar/, sin guardar nada, y propone día y hora en el issue del repo del proyecto, con nombre. Desde ahí el pedido corre por sus cinco etapas."
