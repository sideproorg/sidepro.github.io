# "Cómo participar", en tres pasos (la persona). Cómo se hace un pedido, en cinco etapas, está en la RFC-001 (el pedido).
# Cada línea entre comillas: si el texto lleva dos puntos, YAML lo leería como otra cosa.
- "Anotate. Decís qué hacés en IT y tus horas libres reales, y elegís cómo entrás: traés una organización socio-ambiental de tu localidad que ya sabe qué le falta, y lo contás como puedas (texto, audio o foto del papel); o te anotás a dos de los pedidos de /jects. Contesta una persona, con nombre."
- "Papel. Si trajiste un proyecto, antes de escribir código nos juntamos en persona con quien va a usar el sistema cada día, sobre el cuaderno donde hoy se pierde todo, y dibujamos en papel cómo se carga, se busca y se corrige un dato. Si quien opera no lo entiende, no se programa. De ahí sale la ficha firmada. Si entraste a dos pedidos, arrancás por videollamada: escuchás el audio de esa sesión y firmás el acuerdo antes de tocar datos."
- "Fecha. En el formulario marcás tus franjas libres de la semana. Quien convoca las cruza en /cruzar/, sin guardar nada, y propone día y hora en el issue del repo del proyecto, con nombre. Desde ahí el pedido corre por sus cinco etapas."
