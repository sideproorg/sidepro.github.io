# Tarjetas de /fesionals. Solo quien quiso aparecer, y con lo que quiso mostrar.
# Nunca el empleador, nunca un correo público. Se puede cambiar o bajar el mismo día con un PR.
# Para agregar una tarjeta, copiar el bloque de ejemplo y borrar "ejemplo: true".
# Campos: nombre (o alias), ciudad, sabe (una línea), trajo (id del pedido), esta_en (id del pedido o vacío),
#         desde (mes), repo (URL del fork con su nombre, o vacío), opera (true si es quien opera del lado del proyecto).
- ejemplo: true
  nombre: "[nombre o alias]"
  ciudad: "[ciudad]"
  sabe: "[qué sabe hacer, en una línea]"
  trajo: "pedido-00N"
  esta_en: "[la ficha]"
  desde: "[mes]"
  repo: ""
  opera: false
