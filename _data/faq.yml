# Preguntas honestas. Donde no hay respuesta, "todavía no sabemos" y cuándo se decide.
- q: ¿Y mi contrato con mi empleador?
  a: Muchos contratos con empresas de afuera ceden la propiedad intelectual de lo que hacés y algunos prohíben contribuir a código con ciertas licencias. Antes de empezar hay una carta de una página, en español e inglés, para que la presentes en tu empresa. Es insumo, no salvoconducto; si tu empresa tiene su propio formulario de proyectos externos, usalo.
- q: ¿Qué licencia tiene el código que escribo?
  a: Todavía no sabemos. La decide cada proyecto de una lista corta de licencias abiertas, y se escribe en la ficha antes de que te anotes. La regla general se discute en público, en la RFC-002.
- q: ¿Cuántas horas de verdad?
  a: Al menos 4 por semana durante 12 semanas, con hitos, no con cadencia; el techo lo ponés vos. Unas 50 horas útiles en total. Si una semana no podés, avisás y no pasa nada.
- q: ¿Tengo que traer un proyecto?
  a: "Hay dos maneras de entrar. Traés uno: una organización socio-ambiental de tu ciudad o zona, vivas donde vivas, que ya exista y ya sepa qué le falta, con alguien que lo vaya a operar y esté dispuesto a firmar la ficha de una página; lo que falta lo dicen ellos, no vos. O te anotás a dos de los pedidos que ya están en /jects: entrás como segunda de esos pedidos y no abrís pedidos nuevos; si llegás después de la sesión 0, escuchás su grabación y firmás el acuerdo antes de tocar datos. Los pedidos sin firma se pueden elegir desde ya, pero arrancan cuando el proyecto firme."
- q: ¿Qué mando si traigo un proyecto?
  a: "Una línea con qué es y en qué localidad, y si querés un archivo de hasta 10 MB: un audio tuyo contando qué se pierde hoy, una foto del cuaderno, un PDF. Lo escucha o lo mira una persona con nombre, no pasa por ninguna IA, se vuelca a la ficha y se borra al firmarla o a los 30 días, con constancia. Sin nombres, voces ni caras de otras personas: si en el audio habla quien opera, tiene que saberlo y autorizarlo."
- q: ¿Y si no conozco ningún proyecto?
  a: Preguntá en tu cuadra quién lleva las cuentas del club, del comedor, de la feria, de la cooperativa, de la biblioteca. Casi siempre es un cuaderno o un grupo de WhatsApp que se pierde. Si no aparece ninguno, todavía no es el momento; sin proyecto no hay sesión 0.
- q: ¿Y si ahora no trabajo para ninguna empresa?
  a: Entonces esto todavía no es para vos. sidepro es un side project al costado de un trabajo que paga, no un trabajo sin sueldo. Cuando vuelvas a tener uno, la puerta sigue abierta. Nunca se pide ni se publica el nombre del empleador.
- q: ¿Qué pasa si me voy?
  a: Te vas sin sanción. Lo que entregaste queda con licencia abierta y con traspaso documentado. Lo único que se pide es avisar y no desaparecer sin decir nada.
- q: ¿De quién es el código?
  a: Del proyecto, desde el primer commit; su cuenta es la canónica. sidepro guarda un fork público con el historial intacto, para que tu trabajo y tu nombre sobrevivan si el proyecto borra su repo. Sin datos, capturas ni credenciales de nadie.
- q: ¿Se cobra?
  a: "Puede que sí, puede que no: depende de cada proyecto, de sus fondos, de si quiere o puede pagar, o de que consiga financiamiento. Por defecto son horas libres. Si hay remuneración, se escribe en la ficha antes de empezar: por qué hito y en qué forma, con factura o en especie con su valor en pesos. Ningún acuerdo es precedente de otro. Podés decir que no y el pedido sigue igual. sidepro no cobra, no paga ni intermedia. Revisá tu contrato antes."
- q: ¿Cómo arranca un pedido y cuántas reuniones tiene?
  a: "Seis horas en doce semanas, todas en línea: una llamada corta entre los dos fessionals para repartirse roles, una sesión 0 de dos horas con quien opera (se graba con permiso, y quien entra después la escucha), cinco quincenales de quince minutos y un traspaso de una hora. Las fechas no las pone ningún sistema: en el formulario marcás tus franjas libres, quien convoca las cruza en /cruzar/ en su navegador, sin guardar nada, y propone día y hora en el issue del repo, con nombre. Las cinco etapas (pedido, papel, datos reales, sola, traspaso), los roles y qué se registra dónde están en la RFC-001, que se puede comentar."
- q: ¿Qué no vamos a construir?
  a: Apps móviles, modelos de IA, integraciones con bancos o AFIP, logins para cincuenta usuarios, dashboards en tiempo real. Sí formularios, planillas con validaciones, bases simples y exportaciones; lo que una persona del proyecto pueda operar y modificar sin vos.
- q: ¿Y si el proyecto no responde?
  a: Si la operadora no aparece, el pedido se pausa a los diez días y se renegocia a los treinta; nunca "lo opera la dupla mientras tanto". Si alguien te deja colgado, lo decimos en el postmortem, que se publica igual.
- q: ¿Qué pasa con mis datos si escribo?
  a: Hoy el formulario está cerrado porque guardar nombre y contacto exige un responsable con nombre y domicilio (Ley 25.326) y todavía no lo hay. Si escribís al correo del proyecto, lo lee una persona con nombre, no se cede a nadie y se borra cuando lo pidas. Cuando el formulario abra, el aviso va a decir quién guarda, para qué, hasta cuándo y cómo se borra.
- q: ¿Dónde queda registrado lo que se hace?
  a: "En el repo del proyecto, en archivos de texto: una línea por avance en CAMBIOS.md, y el commit que la trae dice quién, cuándo y qué. La rama principal está protegida y se entra por PR, así que nadie escribe sobre lo que no leyó; lo que estuvo mal se revierte, no se borra. Cada fessional trabaja desde su fork, con su nombre en el historial, y se lo lleva cuando se va. Son archivos: se clonan y se mudan con un git push. Cómo se arma, paso a paso, en plantillas/REPO.md."
