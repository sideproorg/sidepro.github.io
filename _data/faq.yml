# Preguntas honestas. Donde no hay respuesta, "todavía no sabemos" y cuándo se decide.
- q: ¿Y mi contrato con mi empleador?
  a: Muchos contratos con empresas del exterior ceden la propiedad intelectual de lo que haces y algunos prohíben contribuir a código con ciertas licencias. Antes de empezar hay una carta de una página, en español e inglés, para que la presentes en tu empresa. Es insumo, no salvoconducto; si tu empresa tiene su propio formulario de proyectos externos, úsalo.
- q: ¿Qué licencia tiene el código que escribo?
  a: Todavía no sabemos. La decide cada proyecto de una lista corta de licencias abiertas, y se escribe en la ficha antes de que te anotes. La regla general se discute en público, en la RFC-002.
- q: ¿Cuántas horas de verdad?
  a: Al menos 4 por semana durante 12 semanas, con hitos, no con cadencia; el techo lo pones tú. Unas 50 horas útiles en total. Si una semana no puedes, avisas y no pasa nada.
- q: ¿Tengo que traer un proyecto?
  a: "Hay dos maneras de entrar. Traes uno: una organización socio-ambiental de tu ciudad o zona, vivas donde vivas, que ya exista y ya sepa qué le falta, con alguien que lo vaya a operar y esté dispuesto a firmar la ficha de una página; lo que falta lo dicen ellos, no tú. O te anotas a dos de los pedidos que ya están en /jects: entras como segunda de esos pedidos y no abres pedidos nuevos; si llegas después de la sesión 0, escuchas su grabación y firmas el acuerdo antes de tocar datos. Los pedidos sin firma se pueden elegir desde ya, pero arrancan cuando el proyecto firme."
- q: ¿Qué mando si traigo un proyecto?
  a: "Solo la etapa 0, como la ves hoy desde afuera: qué es la organización, qué hace y para quién, dónde, desde cuándo, cuántas personas la sostienen y cómo la conoces; qué se pierde o cuesta hoy y cómo lo hacen; los supuestos que todavía no confirmaste, uno por línea; y con quién vas a hablar. Sin nombres de personas. Lo demás se averigua en la etapa 1, cuando te reúnes con la organización con la hoja RELEVAMIENTO.md."
- q: ¿Y si no conozco ningún proyecto?
  a: Pregunta en tu barrio quién lleva las cuentas del club, del comedor, de la feria, de la cooperativa, de la biblioteca. Casi siempre es un cuaderno o un grupo de WhatsApp que se pierde. Si no aparece ninguno, todavía no es el momento; sin proyecto no hay sesión 0.
- q: ¿Y si ahora no trabajo para ninguna empresa?
  a: Entonces esto todavía no es para ti. sidepro es un side project al costado de un trabajo que paga, no un trabajo sin sueldo. Cuando vuelvas a tener uno, la puerta sigue abierta. Nunca se pide ni se publica el nombre del empleador.
- q: ¿Qué pasa si me voy?
  a: Te vas sin sanción. Lo que entregaste queda con licencia abierta y con traspaso documentado. Lo único que se pide es avisar y no desaparecer sin decir nada.
- q: ¿De quién es el código?
  a: Del proyecto, desde el primer commit; su cuenta es la canónica. sidepro guarda un fork público con el historial intacto, para que tu trabajo y tu nombre sobrevivan si el proyecto borra su repo. Sin datos, capturas ni credenciales de nadie.
- q: ¿Se cobra?
  a: "Puede que sí, puede que no: depende de cada proyecto, de sus fondos, de si quiere o puede pagar, o de que consiga financiamiento. Por defecto son horas libres. Si hay remuneración, se escribe en la ficha antes de empezar: por qué hito y en qué forma, con factura o en especie con su valor en pesos. Ningún acuerdo es precedente de otro. Puedes decir que no y el pedido sigue igual. sidepro no cobra, no paga ni intermedia. Revisa tu contrato antes."
- q: ¿Cómo arranca un pedido y cuántas reuniones tiene?
  a: "Seis horas en doce semanas, todas en línea: una llamada corta entre los dos fessionals para repartirse roles, una sesión 0 de dos horas con quien opera (se graba con permiso, y quien entra después la escucha), cinco quincenales de quince minutos y un traspaso de una hora. Las fechas no las pone ningún sistema: en el formulario marcas tus franjas libres, quien convoca las cruza en /cruzar/ en su navegador, sin guardar nada, y propone día y hora en el issue del repo, con nombre. Las etapas (descripción, relevamiento, papel, datos reales, sola, traspaso), los roles y qué se registra dónde están en la RFC-001, que se puede comentar."
- q: ¿Qué no vamos a construir?
  a: Apps móviles, modelos de IA, integraciones con bancos o AFIP, logins para cincuenta usuarios, dashboards en tiempo real. Sí formularios, planillas con validaciones, bases simples y exportaciones; lo que una persona del proyecto pueda operar y modificar sin ti.
- q: ¿Y si el proyecto no responde?
  a: Si la operadora no aparece, el pedido se pausa a los diez días y se renegocia a los treinta; nunca "lo opera la dupla mientras tanto". Si alguien te deja colgado, lo decimos en el postmortem, que se publica igual.
- q: ¿Qué pasa con mis datos si escribo?
  a: "El formulario no los guarda en ninguna web: al enviarlo se abre tu programa de correo y lo mandas tú al buzón del proyecto. Lo lee una persona con nombre, no se cede a nadie y se borra cuando lo pidas, o a los 90 días si no arrancó ningún pedido contigo. El responsable es sidepro, organización descentralizada; para acceso, rectificación o supresión, escribe al correo del proyecto."
- q: ¿Dónde queda registrado lo que se hace?
  a: "En el repo del proyecto, en archivos de texto: una línea por avance en CAMBIOS.md, y el commit que la trae dice quién, cuándo y qué. La rama principal está protegida y se entra por PR, así que nadie escribe sobre lo que no leyó; lo que estuvo mal se revierte, no se borra. Cada fessional trabaja desde su fork, con su nombre en el historial, y se lo lleva cuando se va. Son archivos: se clonan y se mudan con un git push. Cómo se arma, paso a paso, en plantillas/REPO.md."
