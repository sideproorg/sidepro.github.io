# Despliega el Worker del formulario (worker/) en la cuenta de Cloudflare de sidepro.
# Corre cuando cambia algo en worker/ o a mano desde la pestaña Actions.
# Necesita dos secretos del repo: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: worker
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
